name: Auto-Sync & Deploy Live Cloud Egress Fees
on:
  push:
    branches: ["main"]
  schedule:
    - cron: "35 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch live AWS Price List metadata & probe 18 cloud storage/CDN providers
        run: |
          python3 scripts/sync_egress_fees.py
          python3 scripts/prerender_seo.py
      - name: Commit updated egress_fees.json, SSR index.html, sitemap & daily history archive
        run: |
          git config user.name "CloudEgressFees Bot"
          git config user.email "bot@cloudegressfees.com"
          git add public/egress_fees.json public/index.html public/sitemap.xml public/*.txt public/history/
          if ! git diff --staged --quiet; then
            git commit -m "chore(egress): auto-sync cloud storage & egress pricing, SSR HTML & history [skip ci]"
            git pull --rebase -X ours origin main
            git push origin HEAD:main
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site artifact (public/)
        uses: actions/upload-pages-artifact@v4
        with:
          path: "public"

  deploy:
    needs: sync-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Ping IndexNow after Pages deploy
        run: python3 scripts/prerender_seo.py --ping-indexnow || true
